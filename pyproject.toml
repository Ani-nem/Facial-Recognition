[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "faceorg"
version = "0.1.0"
description = "Organize a photo library by person using facial recognition, without duplicating files."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ani-nem" }]
keywords = ["facial-recognition", "photos", "cli", "symlink", "organization"]
dependencies = [
    "face_recognition==1.3.0",
    "dlib>=19.24",
    "numpy>=1.26",
    "opencv-python>=4.10",
    "typer>=0.12",
]

[project.optional-dependencies]
cluster = ["scikit-learn>=1.4"]
dev = ["pytest>=8", "pytest-cov", "scikit-learn>=1.4", "pillow>=10"]

[project.scripts]
faceorg = "faceorg.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["faceorg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
